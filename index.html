<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감사 인사</title>
<meta property="og:title" content="민수 ♥ 혜진 결혼식에 와주셔서 감사합니다">
<meta property="og:description" content="혼주 신청룡·최소영 드림">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Gowun+Batang:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #f3ece7;
    --bg2: #e7ddd6;
    --paper: #fcf9f6;
    --ink: #3a2f2b;
    --soft: #8a7a72;
    --kraft: #d3a79d;
    --kraft2: #c4968c;
    --kraft3: #b8877d;
    --rose: #a34b57;
    --vh: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(120% 80% at 50% 20%, var(--bg1), var(--bg2)) fixed;
    font-family: 'Gowun Batang', serif; color: var(--ink);
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }

  /* ── 첫 화면: 봉투 ── */
  #intro { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; transition: opacity .8s; }
  #intro.gone { opacity: 0; pointer-events: none; }
  .top-msg { text-align: center; transition: opacity .5s; }
  .top-msg .en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: var(--soft); letter-spacing: .06em; }
  .top-msg .ko { margin-top: 6px; font-size: 15px; color: var(--soft); }
  .hint { display: flex; align-items: center; gap: 10px; padding: 16px 30px; border: 0; border-radius: 999px;
    background: linear-gradient(135deg, #f9b8cb, #ee86a6); color: #fff; font: inherit; font-size: clamp(19px, 5.4vw, 23px); font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(190,70,110,.45); box-shadow: 0 8px 22px rgba(238,134,166,.45), inset 0 1px 0 rgba(255,255,255,.4); cursor: pointer; animation: nudge 1.6s ease-in-out infinite; transition: opacity .4s; }
  .hint .hand { width: 1.35em; height: 1.6em; flex: none; filter: drop-shadow(0 1px 1.5px rgba(190,70,110,.4)); animation: tap 1.6s ease-in-out infinite; }
  .hint-sub { margin-top: -14px; font-size: clamp(14px, 4vw, 16px); color: var(--soft); transition: opacity .4s; }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .opened .top-msg, .opened .hint, .opened .hint-sub { opacity: 0; animation: none; }
  #intro { cursor: pointer; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* 봉투는 340×230 기준으로 그리고 화면 폭에 맞춰 확대/축소 */
  .env-box { width: calc(340px * var(--es, 1)); height: calc(230px * var(--es, 1)); }
  .env { position: relative; width: 340px; height: 230px; perspective: 900px; cursor: pointer;
    transform-origin: top left; transform: scale(var(--es, 1)); }
  .env-inner { position: absolute; inset: 0; perspective: 800px; perspective-origin: 50% 0;
    transition: transform 1s cubic-bezier(.6,0,.4,1); }
  .env-float { position: relative; width: 100%; height: 100%; animation: float 3.2s ease-in-out infinite; }
  .opened .env-float { animation-play-state: paused; }
  .env-back { position: absolute; inset: 0; border-radius: 6px; background: var(--kraft3);
    box-shadow: 0 18px 40px rgba(90,50,40,.25); }
  .letter { position: absolute; left: 22px; top: 14px; width: 296px; height: 200px; z-index: 2;
    background: var(--paper); border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 26px;
    font-family: 'Great Vibes', cursive; font-size: 40px; color: var(--rose);
    transition: transform 1s cubic-bezier(.3,.7,.3,1); }
  .env-front { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .flap { position: absolute; left: 0; top: 0; width: 340px; height: 140px; z-index: 4;
    transform-origin: top center; transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.5,0,.3,1); }
  .flap svg { position: absolute; inset: 0; backface-visibility: hidden; }
  .flap .inside { transform: rotateX(180deg); }
  .seal { position: absolute; left: 146px; top: 104px; width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c86672, var(--rose) 60%, #7e3240);
    box-shadow: 0 3px 6px rgba(80,20,30,.35), inset 0 0 0 4px rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center; color: #f6dfe2; font-size: 20px;
    backface-visibility: hidden; }
  .names { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 5;
    font-family: 'Great Vibes', cursive; font-size: 30px; color: #fff7f3; text-shadow: 0 1px 2px rgba(120,60,50,.35); }

  @keyframes float { 0%, 100% { transform: none; } 50% { transform: translateY(-5px); } }

  .opened .flap { transform: rotateX(180deg); }
  .opened .flap.behind { z-index: 1; }
  .rise .letter { transform: translateY(-165px); }
  .drop .env-inner { transform: translateY(120vh); }

  /* ── 카드 ── */
  #main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(clamp(8px, calc(var(--vh) * 2), 16px), env(safe-area-inset-top)) 12px max(clamp(8px, calc(var(--vh) * 2), 20px), env(safe-area-inset-bottom)); }
  .card { position: relative; width: min(100%, 480px);
    background:
      repeating-linear-gradient(90deg, rgba(120,90,80,.03) 0 1px, transparent 1px 5px),
      var(--paper);
    border-radius: 4px; box-shadow: 0 24px 60px rgba(90,55,45,.22), 0 2px 6px rgba(0,0,0,.06);
    opacity: 0; transform: translateY(60px) scale(.92);
    transition: transform 1.1s cubic-bezier(.25,.8,.3,1), opacity .8s; }
  .card.in { opacity: 1; transform: none; }
  .frame { position: absolute; inset: 10px; border: 1px solid #eadbd3; border-radius: 2px; pointer-events: none; }
  .deco { position: absolute; pointer-events: none; height: auto; }
  .d-tl { left: -2.5%; top: -4%; width: 21%; }
  .d-tr { right: -8%; top: -5%; width: 32%; }
  .d-bl { left: -5%; bottom: -3%; width: 30%; }
  .d-br { right: -1%; bottom: -1%; width: 26%; }

  /* 화면 높이(--vh)에 맞춰 여백·그림을 줄여 한 화면에 들어가게. 본문 글자는 13.5px 아래로 안 내려감 */
  .content { position: relative; text-align: center;
    padding: clamp(40px, min(15vw, calc(var(--vh) * 7.5)), 76px) clamp(16px, 5vw, 32px) clamp(46px, min(13vw, calc(var(--vh) * 8)), 76px);
    word-break: keep-all; }
  .title { font-family: 'Cormorant Garamond', serif; font-size: clamp(15px, 4.3vw, 19px); letter-spacing: .22em; color: var(--ink); }
  .couple { display: block; margin: 4px auto 0; width: min(68%, 300px, calc(var(--vh) * 27)); height: auto; overflow: visible; }
  .body { margin-top: 6px; font-size: clamp(13.5px, 3.75vw, 16px); line-height: 1.8; color: #4a3d38; }
  .body p { margin: 0 0 min(1em, calc(var(--vh) * 1.9)); }
  @media (max-height: 780px) { .body { line-height: 1.66; } }
  @media (max-height: 640px) { .body { line-height: 1.56; } }
  .sign { margin-top: .2em; }
  .sign b { font-weight: 700; letter-spacing: .06em; }
  .date { margin-top: .35em; font-variant-numeric: lining-nums; font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, min(9vw, calc(var(--vh) * 5.2)), 40px); letter-spacing: .12em; color: var(--ink); line-height: 1.2; }
  .date small { display: block; margin-top: 4px; font-family: 'Gowun Batang', serif; font-size: clamp(12px, 3.3vw, 14px); letter-spacing: .18em; color: var(--soft); }
  .replay { position: absolute; left: 50%; bottom: clamp(8px, calc(var(--vh) * 1.6), 18px); transform: translateX(-50%); white-space: nowrap;
    border: 0; background: none; font: inherit; font-size: 14px; color: var(--soft);
    letter-spacing: .1em; cursor: pointer; padding: 10px 16px; }

  .fade { opacity: 0; transform: translateY(10px); }
  .replay.fade { transform: translateX(-50%); }
  .show .replay.fade { animation-name: fadeIn; }
  @keyframes fadeIn { to { opacity: 1; } }
  .show .fade { animation: fadeUp .9s cubic-bezier(.3,.7,.3,1) forwards; animation-delay: var(--d, 0s); }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  /* ── 신랑·신부 인사 ──
     정면에서 허리 숙이는 모습: 상체가 짧아지고(앞으로 기울어서), 머리가 내려가며
     얼굴은 아래로 눌리고 정수리 머리카락이 더 보인다. 둘이 동시에 숙인다. */
  .couple g { transform-box: view-box; }
  .g-up { transform-origin: 78px 150px; --bd: 1.3s; }
  .g-head { transform-origin: 78px 96px; --bd: 1.3s; }
  .g-face { transform-origin: 78px 94px; --bd: 1.3s; }
  .g-crown { transform-origin: 78px 37px; --bd: 1.3s; }
  .b-up { transform-origin: 142px 128px; --bd: 1.3s; }
  .b-head { transform-origin: 142px 96px; --bd: 1.3s; }
  .b-face { transform-origin: 142px 93px; --bd: 1.3s; }
  .b-crown { transform-origin: 142px 39px; --bd: 1.3s; }
  .show .g-up, .show .b-up { animation: bowBody 6s var(--bd) infinite; }
  .show .g-head, .show .b-head { animation: bowHead 6s var(--bd) infinite; }
  .show .g-face, .show .b-face { animation: bowFace 6s var(--bd) infinite; }
  .show .g-crown, .show .b-crown { animation: bowCrown 6s var(--bd) infinite; }
  @keyframes bowBody {
    0%, 4%   { transform: none; animation-timing-function: cubic-bezier(.45,0,.35,1); }
    20%, 34% { transform: translateY(3px) scaleY(.9); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    47%      { transform: translateY(-1px) scaleY(1.012); animation-timing-function: ease-in-out; }
    54%, 100% { transform: none; }
  }
  @keyframes bowHead {
    0%, 4%   { transform: none; animation-timing-function: cubic-bezier(.45,0,.35,1); }
    20%, 34% { transform: translateY(12px) scaleY(.9); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    47%      { transform: translateY(-1.5px); animation-timing-function: ease-in-out; }
    54%, 100% { transform: none; }
  }
  @keyframes bowFace {
    0%, 4%   { transform: none; animation-timing-function: cubic-bezier(.45,0,.35,1); }
    20%, 34% { transform: translateY(7px) scaleY(.7); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    50%, 100% { transform: none; }
  }
  @keyframes bowCrown {
    0%, 4%   { transform: none; animation-timing-function: cubic-bezier(.45,0,.35,1); }
    20%, 34% { transform: scaleY(2.15); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    50%, 100% { transform: none; }
  }
  .heart { opacity: 0; }
  .show .heart { animation: heart 6s ease-out 1.5s infinite; }
  .show .heart.h2 { animation-delay: 1.75s; }
  .show .heart.h3 { animation-delay: 2s; }
  @keyframes heart {
    0%, 46% { opacity: 0; transform: translateY(10px) scale(.4); }
    54% { opacity: 1; transform: translateY(0) scale(1); }
    76% { opacity: 0; transform: translateY(-26px) scale(1.05); }
    100% { opacity: 0; }
  }
  .heart { transform-origin: 110px 40px; }

  /* ── 꽃잎 ── */
  #petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .petal { position: absolute; top: -40px; border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #fbe9e6, #f0c9c6); opacity: .9;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

  @media (prefers-reduced-motion: reduce) {
    .show .couple *, .petal { animation: none !important; }
  }
</style>
</head>
<body class="locked">
<div id="intro">
  <div class="top-msg"><div class="en">a letter for you</div><div class="ko">소중한 분께 드리는 감사 인사</div></div>
  <div class="env-box">
    <div class="env-float"><div class="env" id="env" role="button" aria-label="봉투 열기">
      <div class="env-inner">
        <div class="env-back"></div>
        <div class="letter">Thank you</div>
        <svg class="env-front" viewBox="0 0 340 230" aria-hidden="true">
          <defs>
            <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
              <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .25  0 0 0 0 .22  0 0 0 .14 0"/>
              <feComposite in2="SourceGraphic" operator="in"/></filter>
          </defs>
          <path d="M0 6 Q0 0 6 2 L160 112 Q170 118 180 112 L334 2 Q340 0 340 6 V224 Q340 230 334 230 H6 Q0 230 0 224Z" fill="var(--kraft)"/>
          <path d="M0 230 L158 124 Q170 116 182 124 L340 230Z" fill="var(--kraft2)"/>
          <path d="M0 6 Q0 0 6 2 L160 112 Q170 118 180 112 L334 2 Q340 0 340 6 V224 Q340 230 334 230 H6 Q0 230 0 224Z" fill="#000" filter="url(#grain)"/>
          <path d="M2 4 L160 112 M338 4 L180 112 M2 228 L158 124 M338 228 L182 124" stroke="rgba(110,60,50,.18)" stroke-width="1.4" fill="none"/>
        </svg>
        <div class="names">Minsu &amp; Hyejin</div>
        <div class="flap" id="flap">
          <svg viewBox="0 0 340 140" aria-hidden="true">
            <path d="M0 0 H340 L184 128 Q170 138 156 128Z" fill="var(--kraft2)"/>
            <path d="M0 0 H340 L184 128 Q170 138 156 128Z" fill="#000" filter="url(#grain)"/>
            <path d="M0 0 L156 128 Q170 138 184 128 L340 0" stroke="rgba(110,60,50,.22)" stroke-width="1.4" fill="none"/>
          </svg>
          <svg class="inside" viewBox="0 0 340 140" aria-hidden="true">

            <path d="M0 140 L156 12 Q170 2 184 12 L340 140" stroke="rgba(110,60,50,.18)" stroke-width="1.4" fill="none"/>
          </svg>
          <div class="seal">♥</div>
        </div>
      </div>
    </div></div>
  </div>
  <button class="hint" type="button"><svg class="hand" viewBox="0 0 40 48" aria-hidden="true">
      <defs><g id="glove">
        <rect x="9" y="2" width="9.5" height="25" rx="4.75"/>
        <rect x="8" y="18" width="26" height="20" rx="7"/>
        <circle cx="22.5" cy="20.5" r="4.2"/><circle cx="28.3" cy="21.2" r="3.9"/><circle cx="32.3" cy="23.8" r="3.4"/>
        <rect x="9" y="35" width="24" height="9" rx="2"/>
      </g></defs>
      <use href="#glove" fill="#e27a9b" stroke="#e27a9b" stroke-width="3.2" stroke-linejoin="round"/>
      <use href="#glove" fill="#fff"/>
      <path d="M18.6 19 v6 M25.4 22 q.3 2.4 0 4 M30.7 24 q.3 1.8 0 3.2 M9.5 28.5 q6 4.5 15 2.4" stroke="#efb3c6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <g fill="#fff" stroke="#e27a9b" stroke-width="1"><circle cx="11.2" cy="45" r="1.8"/><circle cx="15.6" cy="45.4" r="1.8"/><circle cx="20" cy="45.6" r="1.8"/><circle cx="24.4" cy="45.4" r="1.8"/><circle cx="28.8" cy="45" r="1.8"/></g>
      <path d="M10 37.5 H32" stroke="#f2c3d1" stroke-width="1" stroke-dasharray="1.6 1.6"/>
      <circle cx="21" cy="40.5" r="1.7" fill="#f7d6e0" stroke="#e27a9b" stroke-width=".8"/>
    </svg>여기를 눌러 열어보세요</button>
  <div class="hint-sub">봉투나 화면 아무 곳이나 눌러도 열려요</div>
</div>

<main id="main">
  <div class="card" id="card">
    <div class="frame"></div>

    <!-- 모서리 꽃장식 -->
    <svg class="deco d-tl" viewBox="0 0 120 130" aria-hidden="true">
      <path d="M14 4 C 30 40 44 70 70 100" stroke="#6f9a5a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M30 40 C 18 52 10 70 12 88" stroke="#6f9a5a" stroke-width="1.8" fill="none"/>
      <path d="M46 66 C 60 60 76 62 90 54" stroke="#6f9a5a" stroke-width="1.8" fill="none"/>
      <path d="M24 30 C 44 22 60 34 62 52 C 42 56 28 46 24 30Z" fill="#5f8f52"/>
      <g fill="#f3e6d3"><circle cx="70" cy="100" r="5"/><circle cx="12" cy="88" r="4.5"/><circle cx="90" cy="54" r="4.5"/>
        <circle cx="78" cy="106" r="3.5"/><circle cx="96" cy="48" r="3.5"/><circle cx="16" cy="96" r="3.5"/></g>
      <g fill="#c9b08a"><circle cx="70" cy="100" r="1.8"/><circle cx="12" cy="88" r="1.6"/><circle cx="90" cy="54" r="1.6"/></g>
    </svg>
    <svg class="deco d-tr" viewBox="-70 -70 140 140" aria-hidden="true">
      <defs><radialGradient id="pt" cx=".5" cy=".95" r=".95"><stop offset="0" stop-color="#ecd2c8"/><stop offset=".6" stop-color="#f6e9e3"/><stop offset="1" stop-color="#fdf8f5"/></radialGradient></defs>
      <g transform="rotate(20)" fill="url(#pt)">
        <path id="pp" d="M0 0 C -20 -22 -25 -55 -9 -66 C -3 -61 3 -61 9 -66 C 25 -55 20 -22 0 0Z"/>

    </svg>

    <div class="content">
      <div class="title fade" style="--d:.1s">THANK YOU FOR COMING</div>

      <svg class="couple fade" style="--d:.4s" viewBox="0 0 220 210" aria-label="손잡고 인사하는 신랑 신부">
        <ellipse cx="112" cy="200" rx="84" ry="6" fill="#000" opacity=".07"/>
        <path class="heart" d="M110 46 C 100 38 98 28 105 25 C 108 24 110 26 110 28 C 110 26 112 24 115 25 C 122 28 120 38 110 46Z" fill="#e07a86"/>
        <path class="heart h2" d="M88 34 C 82 29 81 23 85 21 C 87 20 88 22 88 23 C 88 22 89 20 91 21 C 95 23 94 29 88 34Z" fill="#f0a3ab"/>
        <path class="heart h3" d="M134 30 C 128 25 127 19 131 17 C 133 16 134 18 134 19 C 134 18 135 16 137 17 C 141 19 140 25 134 30Z" fill="#f0a3ab"/>

        <!-- 신부 드레스 (고정) -->
        <path d="M128 124 Q122 160 100 198 Q142 210 184 198 Q162 160 156 124Z" fill="#fff" stroke="#eadfe3" stroke-width="1.2"/>
        <path d="M106 190 q6 5 12 0 q6 5 12 0 q6 5 12 0 q6 5 12 0 q6 5 12 0 q6 5 12 0 q6 5 8 0" stroke="#efe4e7" stroke-width="1.4" fill="none"/>
        <path d="M131 140 Q138 150 142 170 M153 140 Q147 152 146 174" stroke="#f1e8eb" stroke-width="1.2" fill="none"/>

        <!-- 신랑 다리 (고정) -->
        <rect x="66" y="146" width="11" height="50" rx="3" fill="#2b2b35"/>
        <rect x="80" y="146" width="11" height="50" rx="3" fill="#2b2b35"/>
        <ellipse cx="70" cy="197" rx="9" ry="4" fill="#15151b"/>
        <ellipse cx="88" cy="197" rx="9" ry="4" fill="#15151b"/>

        <!-- 신부 상체 -->
        <g class="b-up">
          <path d="M126 50 Q106 120 110 190 Q146 200 182 190 Q178 120 160 50Z" fill="#fff" opacity=".55"/>

<div id="petals"></div>

<script>
  var root = document.documentElement;
  function fitEnvelope() {
    root.style.setProperty('--vh', (window.innerHeight / 100) + 'px');
    var s = Math.min((window.innerWidth - 40) / 340, 1.25);
    root.style.setProperty('--es', s.toFixed(3));
  }
  fitEnvelope(); window.addEventListener('resize', fitEnvelope);

  var intro = document.getElementById('intro'), env = document.getElementById('env'),
      flap = document.getElementById('flap'), card = document.getElementById('card'),
      main = document.getElementById('main');
  var started = false;

  function petals(n) {
    var box = document.getElementById('petals');
    for (var i = 0; i < n; i++) {
      var p = document.createElement('div');
      p.className = 'petal';
      var size = 10 + Math.random() * 10;
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = size + 'px'; p.style.height = (size * 1.25) + 'px';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      p.style.animationDelay = (Math.random() * 4) + 's';
      p.addEventListener('animationend', function () { this.remove(); });
      box.appendChild(p);
    }
  }

  function open() {
    if (started) return; started = true;
    intro.classList.add('opened'); env.classList.add('opened');
    setTimeout(function () { flap.classList.add('behind'); }, 420);
    setTimeout(function () { env.classList.add('rise'); }, 800);
    setTimeout(function () { env.classList.add('drop'); intro.classList.add('gone'); card.classList.add('in'); petals(28); }, 1800);
    setTimeout(function () { main.classList.add('show'); document.body.classList.remove('locked'); }, 2500);
    setTimeout(function () { petals(18); }, 9000);
  }
  intro.addEventListener('click', open);

  // ?open 이면 바로 펼친 상태로 (미리보기용)
  if (/[?&]open/.test(location.search)) {
    document.querySelectorAll('*').forEach(function (el) { el.style.transition = 'none'; });
    intro.classList.add('opened', 'gone'); card.classList.add('in');
    main.classList.add('show'); document.body.classList.remove('locked');
  }
</script>
</body>
